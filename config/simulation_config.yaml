simulation:
  time_step: 0.01
  real_time: false
  gravity: [0, 0, -9.81]
  
camera:
  width: 640
  height: 480
  fov: 60
  near: 0.1
  far: 5.0
  fps: 30

robot_a:
  type: "ur5"
  position: [-0.5, 0, 0.625]
  orientation: [0, 0, 0, 1]
  
robot_b:
  type: "panda"
  position: [0.5, 0, 0.625]
  orientation: [0, 0, 3.14159, 1]  # Facing Robot A

object:
  type: "cube"
  size: [0.05, 0.05, 0.05]
  mass: 0.1
  color: [1, 0, 0, 1]
  initial_position: [-0.3, 0, 0.8]

motion_patterns:
  circle:
    radius: 0.15
    frequency: 0.5
  lissajous:
    a: 0.15
    b: 0.15
    delta: 1.5708  # pi/2
    frequency: 0.5
  sinusoidal:
    amplitude: 0.1
    frequency: 0.3